[project]
name = "hackday"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayman khan", email = "aymankhan.aiml22@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.0",
    "flask-cors>=4.0",
    "google-genai>=1.0",
    "groq>=0.9.0",
    "imbalanced-learn>=0.12",
    "matplotlib>=3.11.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
    "seaborn>=0.13.2",
]

[project.scripts]
hackday = "hackday:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
